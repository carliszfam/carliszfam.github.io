<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The finder pattern from a QR code: the smallest mark that still
       reads as "scan me", and legible down to 16 pixels. -->
  <rect width="64" height="64" fill="#14161A"/>
  <rect x="12" y="12" width="40" height="40" fill="none" stroke="#EDEEE9" stroke-width="7"/>
  <rect x="26" y="26" width="12" height="12" fill="#EDEEE9"/>
</svg>
