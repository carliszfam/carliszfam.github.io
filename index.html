<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shop.css?v=8">
<script src="./config.js?v=8"></script>
</head>
<body>

<header class="masthead" id="masthead"></header>

<main class="shell">

  <section class="hero">
    <div class="hero-label">
      <span class="tag" data-i="heroTag"></span>
      <h1><span data-i="heroH1a"></span><br><span data-i="heroH1b"></span></h1>
      <p class="hero-lede" data-i="heroLede"></p>
      <div class="hero-rule">
        <span class="tag" data-i="tagNumbered"></span>
        <span class="tag" data-i="tagTraceable"></span>
        <span class="tag" data-i="tagCollectible"></span>
        <span class="tag tag-ink" data-i="tagScanBack"></span>
      </div>
    </div>
    <div class="ticker" aria-hidden="true">
      <div class="ticker-track" id="ticker"></div>
    </div>
  </section>

  <section class="how">
    <div class="how-shot">
      <img src="./how.png" alt="Front and back of a numbered shirt"
           onerror="this.closest('.how-shot').classList.add('hide')">
    </div>
    <div class="how-steps">
      <span class="tag" data-i="howTitle"></span>
      <ol class="steps">
        <li><b>01</b><span class="step-t" data-i="how1t"></span><p data-i="how1p"></p></li>
        <li><b>02</b><span class="step-t" data-i="how2t"></span><p data-i="how2p"></p></li>
        <li><b>03</b><span class="step-t" data-i="how3t"></span><p data-i="how3p"></p></li>
        <li><b>04</b><span class="step-t" data-i="how4t"></span><p data-i="how4p"></p></li>
      </ol>
    </div>
  </section>

  <section class="searchbar">
    <input class="input search-input" id="q" type="search"
           data-ph="searchPh" aria-label="Search">
    <div class="chip-row" id="tagRow"></div>
  </section>

  <div id="results" class="hide"></div>
  <div id="rails"></div>
  <div id="railsEmpty" class="empty hide">
    <p class="tag" data-i="nothingYet"></p>
    <p data-i="nothingYetP"></p>
  </div>

  <footer class="foot">
    <span class="redaction" id="footBrand"></span>
    <span class="tag" data-i="smallRuns"></span>
    <a class="tag" href="./admin.html" data-i="backOffice"></a>
  </footer>
</main>

<!-- ---------------- cart drawer ---------------- -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Shopping bag">
  <div class="drawer-head">
    <span class="tag tag-ink" data-i="yourBag"></span>
    <button class="x-btn" id="drawerClose" aria-label="Close bag">&times;</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>

<!-- ---------------- auth / account ---------------- -->
<div class="modal" id="modal">
  <div class="modal-card" id="modalCard"></div>
</div>

<script type="module">
import {
  cfg, sb, money, escapeHtml, fetchProducts, readCart, setQty, cartCount,
  mountMasthead, refreshCredit, refreshCartCount, renderRail,
  currentUser, signIn, signUp, signOut, fetchBalance, startCheckout, rememberRef,
  matchesQuery, allKeywords, productCard, lineKey, priceOf, nameOf, t
} from "./shop.js?v=8";

document.title = cfg.BRAND;
document.documentElement.lang = (await import("./i18n.js?v=8")).LANG;
// fill every element tagged with a translation key
document.querySelectorAll("[data-i]").forEach((el) => { el.textContent = t(el.dataset.i); });
document.querySelectorAll("[data-ph]").forEach((el) => { el.placeholder = t(el.dataset.ph); });
document.getElementById("footBrand").textContent = cfg.BRAND;
mountMasthead(document.getElementById("masthead"));

/* a QR scan can hand us a referral code on the way in */
const params = new URLSearchParams(location.search);
if (params.get("ref")) {
  rememberRef(params.get("ref"));
  history.replaceState({}, "", location.pathname);
}

/* ticker */
const words = t("ticker");
document.getElementById("ticker").innerHTML =
  [...words, ...words].map(w => `<span class="tag">${w}</span>`).join("");

/* ---------------- catalogue ---------------- */
let PRODUCTS = [];
async function loadCatalogue() {
  const mount = document.getElementById("rails");
  try { PRODUCTS = await fetchProducts(); }
  catch { mount.innerHTML = `<p class="notice notice-bad">${t("loadFail")}</p>`; return; }

  if (!PRODUCTS.length) { document.getElementById("railsEmpty").classList.remove("hide"); return; }

  const groups = new Map();
  for (const p of PRODUCTS) {
    if (!groups.has(p.collection)) groups.set(p.collection, []);
    groups.get(p.collection).push(p);
  }
  mount.innerHTML = "";
  for (const [name, items] of groups) {
    renderRail(mount, { title: name.replace(/^\w/, c => c.toUpperCase()), products: items });
  }
  buildTagRow();
}

/* ---------------- search ---------------- */
const qInput  = document.getElementById("q");
const results = document.getElementById("results");
const railsEl = document.getElementById("rails");

function buildTagRow() {
  const row = document.getElementById("tagRow");
  const tags = allKeywords(PRODUCTS).slice(0, 12);
  if (!tags.length) { row.classList.add("hide"); return; }
  row.innerHTML = tags.map(([k, n]) =>
    `<button class="chip tag-chip" data-tag="${escapeHtml(k)}">${escapeHtml(k)} <b>${n}</b></button>`).join("");
  row.querySelectorAll("[data-tag]").forEach((b) =>
    b.addEventListener("click", () => {
      const t = b.dataset.tag;
      qInput.value = qInput.value.trim() === t ? "" : t;   // click again to clear
      runSearch();
    }));
}

function runSearch() {
  const query = qInput.value.trim();
  document.querySelectorAll("[data-tag]").forEach((b) =>
    b.classList.toggle("on", b.dataset.tag === query.toLowerCase()));

  if (!query) {
    results.classList.add("hide");
    railsEl.classList.remove("hide");
    return;
  }

  const hits = PRODUCTS.filter((p) => matchesQuery(p, query));
  railsEl.classList.add("hide");
  results.classList.remove("hide");
  results.innerHTML = `
    <div class="rail-head">
      <h2>${hits.length ? `${hits.length} ${hits.length === 1 ? t("matches") : t("matchesPl")}` : t("nothingFound")}</h2>
      <span class="tag">${t("forQuery")} “${escapeHtml(query)}”</span>
      <button class="chip" id="clearQ" style="margin-left:auto">${t("clear")}</button>
    </div>
    <div class="results-grid"></div>`;

  const grid = results.querySelector(".results-grid");
  if (hits.length) hits.forEach((p) => grid.appendChild(productCard(p)));
  else grid.innerHTML = `<p class="empty">${t("noMatch")}</p>`;

  document.getElementById("clearQ").addEventListener("click", () => { qInput.value = ""; runSearch(); });
}

let debounce;
qInput.addEventListener("input", () => { clearTimeout(debounce); debounce = setTimeout(runSearch, 140); });
qInput.addEventListener("search", runSearch);

/* ---------------- cart drawer ---------------- */
const scrim = document.getElementById("scrim");
const drawer = document.getElementById("drawer");
const openDrawer = () => { drawer.classList.add("open"); scrim.classList.add("open"); paintCart(); };
const closeDrawer = () => { drawer.classList.remove("open"); scrim.classList.remove("open"); };
scrim.addEventListener("click", closeDrawer);
document.getElementById("drawerClose").addEventListener("click", closeDrawer);
document.getElementById("cartChip").addEventListener("click", openDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeDrawer(); closeModal(); } });

let useCredit = false;
let discount = null;   // { code, discount_cents } once validated

async function paintCart() {
  const body = document.getElementById("drawerBody");
  const foot = document.getElementById("drawerFoot");
  const lines = readCart()
    .map(l => {
      const product = PRODUCTS.find(p => p.id === l.product_id);
      const variant = product?.variants?.find(v => v.id === l.variant_id) || null;
      return { ...l, product, variant, key: lineKey(l), unit: product ? priceOf(product, variant) : 0 };
    })
    .filter(l => l.product);

  if (!lines.length) {
    body.innerHTML = `<p class="empty">${t("bagEmpty")}</p>`;
    foot.innerHTML = "";
    return;
  }

  body.innerHTML = lines.map(l => `
    <div class="line">
      <div class="line-shot">${l.product.image_url
        ? `<img src="${l.product.image_url}" alt="">` : ""}</div>
      <div style="flex:1">
        <div class="card-name">${escapeHtml(nameOf(l.product))}</div>
        <span class="tag">${escapeHtml(l.product.sku)}${l.variant ? ` · ${t("size")} ${escapeHtml(l.variant.size)}` : ""}</span>
        <div class="qty">
          <button data-id="${l.key}" data-q="${l.qty - 1}">&minus;</button>
          <span class="serial">${l.qty}</span>
          <button data-id="${l.key}" data-q="${l.qty + 1}">+</button>
          <span class="price" style="margin-left:auto">${money(l.unit * l.qty)}</span>
        </div>
      </div>
    </div>`).join("");

  body.querySelectorAll(".qty button").forEach(b =>
    b.addEventListener("click", () => setQty(b.dataset.id, Number(b.dataset.q))));

  const subtotal = lines.reduce((s, l) => s + l.unit * l.qty, 0);

  // a code stops applying if the basket drops below its minimum
  if (discount) {
    const { data } = await sb.rpc("check_discount", { p_code: discount.code, p_subtotal_cents: subtotal });
    discount = data?.ok ? { code: data.code, discount_cents: data.discount_cents } : null;
  }
  const cut = discount?.discount_cents || 0;

  const user = await currentUser();
  const balance = user ? await fetchBalance() : 0;
  const applied = useCredit ? Math.min(balance, subtotal - cut) : 0;

  foot.innerHTML = `
    <div class="promo-row">
      <input class="input" id="promo" placeholder="${t('discountPh')}" value="${discount ? escapeHtml(discount.code) : ""}">
      <button class="chip" id="promoGo">${discount ? t("remove") : t("apply")}</button>
    </div>
    <div id="promoMsg"></div>
    ${balance > 0 ? `
      <label class="credit-toggle">
        <input type="checkbox" id="useCredit" ${useCredit ? "checked" : ""}>
        <span class="tag" style="color:inherit">${t("useCredit")} ${money(balance)} ${t("creditWord")}</span>
      </label>` : ""}
    <div class="total-row"><span class="tag">${t("subtotal")}</span><span class="price">${money(subtotal)}</span></div>
    ${cut ? `<div class="total-row"><span class="tag">${escapeHtml(discount.code)}</span><span class="price">−${money(cut)}</span></div>` : ""}
    ${applied ? `<div class="total-row"><span class="tag">${t("credit")}</span><span class="price">−${money(applied)}</span></div>` : ""}
    <div class="total-row grand"><span class="tag tag-ink">${t("toPay")}</span><span class="price">${money(subtotal - cut - applied)}</span></div>
    <div id="checkoutMsg"></div>
    <button class="btn" id="checkoutBtn" style="margin-top:14px">${t("checkout")}</button>`;

  document.getElementById("promoGo").addEventListener("click", async () => {
    const msg = document.getElementById("promoMsg");
    if (discount) { discount = null; paintCart(); return; }
    const code = document.getElementById("promo").value.trim();
    if (!code) return;
    const { data, error } = await sb.rpc("check_discount", { p_code: code, p_subtotal_cents: subtotal });
    if (error || !data?.ok) {
      msg.innerHTML = `<p class="notice notice-bad">${escapeHtml(data?.error || "That code is not valid.")}</p>`;
      return;
    }
    discount = { code: data.code, discount_cents: data.discount_cents };
    paintCart();
  });

  const toggle = document.getElementById("useCredit");
  if (toggle) toggle.addEventListener("change", () => { useCredit = toggle.checked; paintCart(); });

  document.getElementById("checkoutBtn").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    const msg = document.getElementById("checkoutMsg");
    const email = user?.email || prompt(t("emailPrompt"));
    if (!email) return;
    btn.disabled = true; btn.textContent = t("opening");
    try { await startCheckout({ useCredit, email, discountCode: discount?.code || null }); }
    catch (err) {
      msg.innerHTML = `<p class="notice notice-bad">${escapeHtml(err.message)}</p>`;
      btn.disabled = false; btn.textContent = t("checkout");
    }
  });
}

document.addEventListener("cart:changed", () => { refreshCartCount(); paintCart(); });

/* ---------------- account modal ---------------- */
const modal = document.getElementById("modal");
const card  = document.getElementById("modalCard");
const closeModal = () => modal.classList.remove("open");
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.getElementById("accountChip").addEventListener("click", paintAccount);

async function paintAccount() {
  modal.classList.add("open");
  const user = await currentUser();
  if (!user) return paintAuth("in");

  const { data } = await sb.rpc("my_earnings");
  const e = data || { balance_cents: 0, garments: 0, referrals: 0 };
  const { data: mine } = await sb.rpc("my_garments");
  const garments = mine || [];

  card.innerHTML = `
    <span class="tag">${t("signedInAs")}</span>
    <p class="serial" style="margin:4px 0 20px">${escapeHtml(user.email)}</p>
    <div class="total-row"><span class="tag">${t("balance")}</span><span class="price">${money(e.balance_cents)}</span></div>
    <div class="total-row"><span class="tag">${t("garmentsClaimed")}</span><span class="price">${e.garments}</span></div>
    <div class="total-row"><span class="tag">${t("referredSales")}</span><span class="price">${e.referrals}</span></div>

    <div style="margin-top:22px">
      <span class="tag">${t("myGarments")}</span>
      ${garments.length ? garments.map(g => `
        <div class="garment">
          <div class="garment-top">
            <span class="serial">${escapeHtml(g.item_number)}</span>
            <span class="tag" style="margin-left:auto">${g.hands} ${g.hands === 1 ? t("handsOne") : t("hands")}</span>
          </div>
          ${g.open_token ? `
            <div class="token-box">
              <span class="tag">${t("transferCode")}</span>
              <b class="token">${escapeHtml(fmtToken(g.open_token))}</b>
              <div class="row" style="margin-top:8px">
                <button class="chip" data-copy="${escapeHtml(g.open_token)}">${t("copyCode")}</button>
                <button class="chip" data-cancel="${escapeHtml(g.code)}">${t("cancelTransfer")}</button>
              </div>
              <p class="mini" style="color:var(--ink-soft);margin:8px 0 0">${t("transferNote")}</p>
            </div>`
          : `<button class="chip" data-xfer="${escapeHtml(g.code)}">${t("transfer")}</button>`}
        </div>`).join("")
      : `<p class="mini" style="color:var(--ink-soft);margin:8px 0 0">${t("noGarments")}</p>`}
    </div>

    <div style="margin-top:24px;border-top:1px solid var(--rule);padding-top:18px">
      <span class="tag">${t("receiveTitle")}</span>
      <p class="mini" style="color:var(--ink-soft);margin:6px 0 10px">${t("receiveNote")}</p>
      <div class="row">
        <input class="input" id="rxToken" placeholder="${t("receivePh")}" style="flex:1;text-transform:uppercase">
        <button class="chip" id="rxGo">${t("receiveGo")}</button>
      </div>
      <div id="rxMsg"></div>
    </div>

    <button class="btn btn-hollow" id="outBtn" style="margin-top:22px">${t("signOut")}</button>`;

  card.querySelectorAll("[data-xfer]").forEach(b =>
    b.addEventListener("click", async () => {
      const { data } = await sb.rpc("create_transfer", { p_code: b.dataset.xfer, p_days: 14 });
      if (!data?.ok) { document.getElementById("rxMsg").innerHTML = `<p class="notice notice-bad">${t("errNotYours")}</p>`; return; }
      paintAccount();
    }));

  card.querySelectorAll("[data-cancel]").forEach(b =>
    b.addEventListener("click", async () => {
      await sb.rpc("cancel_transfer", { p_code: b.dataset.cancel });
      paintAccount();
    }));

  card.querySelectorAll("[data-copy]").forEach(b =>
    b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(fmtToken(b.dataset.copy)); b.textContent = t("copied"); }
      catch { /* clipboard blocked; the code is on screen anyway */ }
      setTimeout(() => (b.textContent = t("copyCode")), 1200);
    }));

  document.getElementById("rxGo").addEventListener("click", async () => {
    const msg = document.getElementById("rxMsg");
    const token = document.getElementById("rxToken").value.trim();
    if (!token) return;
    const { data, error } = await sb.rpc("redeem_transfer", { p_token: token });
    if (error) { msg.innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
    if (!data?.ok) {
      const key = { unknown_token: "errUnknownToken", already_used: "errAlreadyUsed",
                    cancelled: "errCancelled", expired: "errExpired", own_token: "errOwnToken",
                    sender_no_longer_owns: "errStale" }[data?.error] || "errUnknownToken";
      msg.innerHTML = `<p class="notice notice-bad">${t(key)}</p>`;
      return;
    }
    msg.innerHTML = `<p class="notice">${escapeHtml(data.item_number)} ${t("nowYours")}</p>`;
    setTimeout(paintAccount, 1400);
  });

  document.getElementById("outBtn").addEventListener("click", async () => {
    await signOut(); closeModal(); refreshCredit();
  });
}

/* XXXXX-XXXXX reads back over the phone without mistakes */
const fmtToken = (tk) => tk.length === 10 ? `${tk.slice(0, 5)}-${tk.slice(5)}` : tk;

function paintAuth(mode) {
  const isUp = mode === "up";
  card.innerHTML = `
    <span class="tag">${isUp ? t("signUp") : t("signIn")}</span>
    <h2 style="margin:10px 0 18px">${isUp ? t("startBalance") : t("welcomeBack")}</h2>
    ${isUp ? `<label class="field"><span>${t("name")}</span><input class="input" id="aName"></label>` : ""}
    <label class="field"><span>${t("email")}</span><input class="input" id="aEmail" type="email" autocomplete="email"></label>
    <label class="field"><span>${t("password")}</span><input class="input" id="aPass" type="password" autocomplete="${isUp ? "new-password" : "current-password"}"></label>
    <div id="authMsg"></div>
    <button class="btn" id="authGo" style="margin-top:8px">${isUp ? t("createAccount") : t("signIn")}</button>
    <button class="btn btn-hollow" id="authSwap" style="margin-top:8px">${isUp ? t("haveOne") : t("needOne")}</button>
    ${isUp ? "" : `<a class="tag" href="./reset.html" style="display:block;text-align:center;margin-top:14px">${t("forgot")}</a>`}`;

  document.getElementById("authSwap").addEventListener("click", () => paintAuth(isUp ? "in" : "up"));
  document.getElementById("authGo").addEventListener("click", async () => {
    const msg = document.getElementById("authMsg");
    const email = document.getElementById("aEmail").value.trim();
    const pass  = document.getElementById("aPass").value;
    if (!email || !pass) { msg.innerHTML = `<p class="notice notice-bad">${t("needBoth")}</p>`; return; }
    const { error } = isUp
      ? await signUp(email, pass, document.getElementById("aName").value.trim())
      : await signIn(email, pass);
    if (error) { msg.innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
    await refreshCredit();
    paintAccount();
  });
}

/* ---------------- boot ---------------- */
await loadCatalogue();
refreshCartCount();
refreshCredit();
if (params.get("bag")) openDrawer();
sb.auth.onAuthStateChange(() => { refreshCredit(); paintCart(); });
</script>
</body>
</html>
