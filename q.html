<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shop.css?v=8">
<script src="./config.js?v=8"></script>
</head>
<body>

<div class="scan-wrap">
  <header class="scan-head">
    <a class="redaction" href="./index.html" id="brand"></a>
    <span class="tag" id="lblGarment"></span>
    <span class="scan-serial" id="serial">…</span>
  </header>
  <main class="scan-main" id="stage">
    <div class="pane"><p class="tag" id="lblReading"></p></div>
  </main>
</div>

<script type="module">
import {
  cfg, sb, money, escapeHtml, rememberRef, addToCart,
  currentUser, signIn, signUp, nameOf, blurbOf, t
} from "./shop.js?v=8";

document.getElementById("brand").textContent = cfg.BRAND;
document.getElementById("lblGarment").textContent = t("garment");
document.getElementById("lblReading").textContent = t("reading");

const params = new URLSearchParams(location.search);
const CODE = params.get("c");
const ITEM = params.get("i");
const stage = document.getElementById("stage");
const serialEl = document.getElementById("serial");

let status = null;   // { found, item_number, claimed, mine, product }

/* ------------------------------------------------------------------
   The whole page is one decision: has this code been claimed already?
   Claimed  → the shirt already has an owner, so only the shop matters.
   Unclaimed → offer the fork.
   ------------------------------------------------------------------ */
async function boot() {
  if (!CODE) return fail(t("linkBroken"));

  const { data, error } = await sb.rpc("code_status", { p_code: CODE });
  if (error) return fail(t("unreachable"));
  status = data;
  if (!status?.found) return fail(t("noSuchCode"));

  serialEl.textContent = status.item_number || ITEM || "—";
  rememberRef(CODE);                    // the code follows the buyer either way

  if (status.claimed) return viewBuy();
  viewFork();
}

/* ---------- the fork, shown once per garment ---------- */
function viewFork() {
  stage.innerHTML = `
    <div class="choice-grid">
      <button class="choice choice-a" id="pickOwner">
        <span class="choice-title">${t("mineTitleA")}<br>${t("mineTitleB")}</span>
        <p class="choice-note">${t("mineNote")}</p>
        <span class="choice-mark">${t("claimCta")}</span>
      </button>
      <button class="choice choice-b" id="pickBuyer">
        <span class="choice-title">${t("wantTitleA")}<br>${t("wantTitleB")}</span>
        <p class="choice-note">${t("wantNote")}</p>
        <span class="choice-mark">${t("shopCta")}</span>
      </button>
    </div>`;
  document.getElementById("pickOwner").addEventListener("click", viewClaim);
  document.getElementById("pickBuyer").addEventListener("click", viewBuy);
}

/* ---------- claim path: sign in or sign up, then bind the code ---------- */
async function viewClaim() {
  const user = await currentUser();
  if (user) return doClaim();

  render("in");

  function render(mode) {
    const isUp = mode === "up";
    stage.innerHTML = `
      <div class="pane">
        <span class="tag">${t("serial")} ${escapeHtml(status.item_number)}</span>
        <h2 style="margin:12px 0 6px">${isUp ? t("createClaim") : t("signInClaim")}</h2>
        <p class="hero-lede" style="margin-bottom:20px">${t("claimLede")}</p>
        ${isUp ? `<label class="field"><span>${t("name")}</span><input class="input" id="cName"></label>` : ""}
        <label class="field"><span>${t("email")}</span><input class="input" id="cEmail" type="email" autocomplete="email"></label>
        <label class="field"><span>${t("password")}</span><input class="input" id="cPass" type="password" autocomplete="${isUp ? "new-password" : "current-password"}"></label>
        <div id="claimMsg"></div>
        <button class="btn" id="claimGo" style="margin-top:8px">${isUp ? t("createAndClaim") : t("signInAndClaim")}</button>
        <button class="btn btn-hollow" id="claimSwap" style="margin-top:8px">${isUp ? t("haveOne") : t("needOne")}</button>
      </div>`;

    document.getElementById("claimSwap").addEventListener("click", () => render(isUp ? "in" : "up"));
    document.getElementById("claimGo").addEventListener("click", async (e) => {
      const btn = e.currentTarget, msg = document.getElementById("claimMsg");
      const email = document.getElementById("cEmail").value.trim();
      const pass  = document.getElementById("cPass").value;
      if (!email || !pass) { msg.innerHTML = note(t("needBoth"), true); return; }
      btn.disabled = true;
      const { error } = isUp
        ? await signUp(email, pass, document.getElementById("cName").value.trim())
        : await signIn(email, pass);
      if (error) { msg.innerHTML = note(error.message, true); btn.disabled = false; return; }
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        msg.innerHTML = note(t("confirmInbox"), false);
        btn.disabled = false; return;
      }
      doClaim();
    });
  }
}

async function doClaim() {
  const { data, error } = await sb.rpc("claim_code", { p_code: CODE });
  if (error) return fail(t("claimFailed"));

  if (data?.ok) return viewClaimed();
  if (data?.error === "already_claimed")
    return fail(t("alreadyOthers"), true);
  fail(t("cannotClaim"));
}

function viewClaimed() {
  stage.innerHTML = `
    <div class="pane">
      <span class="tag">${t("claimed")}</span>
      <h2 style="margin:12px 0 8px">${t("serial")} ${escapeHtml(status.item_number)} ${t("isYours")}</h2>
      <p class="hero-lede">${t("claimedLede", { amount: money(50) })}</p>
      <a class="btn" href="./index.html" style="margin-top:22px">${t("browseShop")}</a>
    </div>`;
}

/* ---------- buy path ---------- */
function viewBuy() {
  const p = status.product;
  if (!p) {
    stage.innerHTML = `
      <div class="pane">
        <span class="tag">Serial ${escapeHtml(status.item_number)}</span>
        <h2 style="margin:12px 0 8px">${t("outOfCatalogue")}</h2>
        <p class="hero-lede">${t("lookInstead")}</p>
        <a class="btn" href="./index.html" style="margin-top:22px">${t("browseShop")}</a>
      </div>`;
    return;
  }

  const out = p.stock <= 0;
  stage.innerHTML = `
    <div class="buy-pane">
      <div class="buy-shot">${p.image_url
        ? `<img src="${p.image_url}" alt="${escapeHtml(p.name)}">`
        : `<span class="redaction redaction-lg">${escapeHtml(cfg.BRAND)}</span>`}</div>
      <div class="buy-info">
        <span class="tag">${escapeHtml(p.sku)} · ${t("serial")} ${escapeHtml(status.item_number)}</span>
        <h2>${escapeHtml(nameOf(p))}</h2>
        ${blurbOf(p) ? `<p class="hero-lede">${escapeHtml(blurbOf(p))}</p>` : ""}
        <span class="buy-price ${out ? "sold-out" : ""}">${out ? t("soldOut") : money(p.price_cents, p.currency)}</span>
        <button class="btn" id="buyGo" ${out ? "disabled" : ""}>${t("addToBag")}</button>
        <a class="btn btn-hollow" href="./index.html">${t("seeEverything")}</a>
        <p class="tag" style="margin-top:auto">${status.hands
          ? `${status.hands} ${status.hands === 1 ? t("handsOne") : t("hands")} · ` : ""}${status.mine
          ? t("registeredToYou")
          : t("goesToOwner", { amount: money(50) })}</p>
      </div>
    </div>`;

  if (!out) document.getElementById("buyGo").addEventListener("click", () => {
    addToCart(p.id);
    location.href = `./index.html?ref=${encodeURIComponent(CODE)}&bag=1`;
  });
}

/* ---------- helpers ---------- */
const note = (t, bad) => `<p class="notice ${bad ? "notice-bad" : ""}">${escapeHtml(t)}</p>`;

function fail(message, offerShop = true) {
  stage.innerHTML = `
    <div class="pane">
      <span class="tag">${escapeHtml(CODE || "—")}</span>
      <h2 style="margin:12px 0 8px">${escapeHtml(message)}</h2>
      ${offerShop ? `<a class="btn" href="./index.html" style="margin-top:18px">${t("browseShop")}</a>` : ""}
    </div>`;
}

boot();
</script>
</body>
</html>
