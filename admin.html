<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shop.css">
<script src="./config.js"></script>
<!-- 1.4.x is the last line that ships a prebuilt browser bundle; the
     build/ folder was dropped from 1.5 onward, so newer tags 404 here. -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
</head>
<body>

<header class="masthead">
  <div class="masthead-in">
    <a class="redaction" href="./index.html" id="brand"></a>
    <span class="tag">Back office</span>
    <nav class="masthead-nav">
      <span class="tag" id="whoami"></span>
      <button class="chip hide" id="outBtn">Sign out</button>
    </nav>
  </div>
</header>

<main class="shell" style="padding-top:26px;padding-bottom:60px">
  <div id="gate"></div>
  <div id="desk" class="hide">
    <div class="tabs">
      <button class="tab on" data-tab="items">Items</button>
      <button class="tab" data-tab="codes">Garment codes</button>
      <button class="tab" data-tab="orders">Orders</button>
    </div>
    <div id="tabItems"></div>
    <div id="tabCodes" class="hide"></div>
    <div id="tabOrders" class="hide"></div>
  </div>
</main>

<script type="module">
import { cfg, sb, money, escapeHtml, currentUser, signIn, signOut } from "./shop.js";

document.getElementById("brand").textContent = cfg.BRAND;
const $ = (id) => document.getElementById(id);
const eur = (c) => (c / 100).toFixed(2);

/* ================= access gate ================= */
async function boot() {
  const user = await currentUser();
  if (!user) return gateSignIn();

  const { data: admin } = await sb.rpc("is_admin");
  if (!admin) {
    $("gate").innerHTML = `<p class="notice notice-bad">This account is not an administrator.
      Add its user id to the <span class="mini">admins</span> table in Supabase.</p>
      <p class="mini">Your user id: ${escapeHtml(user.id)}</p>`;
    showOut(user);
    return;
  }
  $("gate").classList.add("hide");
  $("desk").classList.remove("hide");
  showOut(user);
  loadItems(); loadCodes(); loadOrders();
}

function showOut(user) {
  $("whoami").textContent = user.email;
  $("outBtn").classList.remove("hide");
  $("outBtn").addEventListener("click", async () => { await signOut(); location.reload(); });
}

function gateSignIn() {
  $("gate").innerHTML = `
    <div class="panel" style="max-width:380px">
      <div class="panel-head"><span class="tag tag-ink">Sign in</span></div>
      <label class="field"><span>Email</span><input class="input" id="gEmail" type="email"></label>
      <label class="field"><span>Password</span><input class="input" id="gPass" type="password"></label>
      <div id="gMsg"></div>
      <button class="btn" id="gGo">Sign in</button>
    </div>`;
  $("gGo").addEventListener("click", async () => {
    const { error } = await signIn($("gEmail").value.trim(), $("gPass").value);
    if (error) { $("gMsg").innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
    location.reload();
  });
}

/* ================= tabs ================= */
document.querySelectorAll(".tab").forEach((t) =>
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
    ["items", "codes", "orders"].forEach((n) =>
      $(`tab${n[0].toUpperCase()}${n.slice(1)}`).classList.toggle("hide", n !== t.dataset.tab));
  }));

/* ================= items ================= */
let ITEMS = [];
let editing = null;

async function loadItems() {
  const { data, error } = await sb.from("products")
    .select("*, variants:product_variants(id,size,sku,price_cents,stock,position,active)")
    .order("collection").order("position");
  if (error) { $("tabItems").innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
  ITEMS = (data || []).map((p) => ({
    ...p, variants: (p.variants || []).sort((a, b) => a.position - b.position) }));
  paintItems();
}

function paintItems() {
  $("tabItems").innerHTML = `
    <div class="admin-grid">
      <div class="panel">
        <div class="panel-head">
          <span class="tag tag-ink">${editing ? "Edit item" : "New item"}</span>
          ${editing ? `<button class="tab" id="cancelEdit" style="margin-left:auto;padding:0">Cancel</button>` : ""}
        </div>
        <label class="field"><span>Code (sku)</span><input class="input" id="fSku" placeholder="TEE-BLACK-M"></label>
        <label class="field"><span>Name</span><input class="input" id="fName" placeholder="Heavyweight tee"></label>
        <label class="field"><span>Description</span><textarea class="input" id="fBlurb" rows="3"></textarea></label>
        <div class="row">
          <label class="field" style="flex:1"><span>Price (${cfg.CURRENCY.toUpperCase()})</span><input class="input" id="fPrice" type="number" step="0.01" min="0" value="0.00"></label>
          <label class="field" style="flex:1"><span>Stock</span><input class="input" id="fStock" type="number" min="0" value="0"></label>
        </div>
        <div class="row">
          <label class="field" style="flex:1"><span>Rail</span><input class="input" id="fColl" value="shirts"></label>
          <label class="field" style="width:90px"><span>Order</span><input class="input" id="fPos" type="number" value="0"></label>
        </div>
        <label class="field"><span>Keywords</span><input class="input" id="fKeys" placeholder="chilli, calabria, cotton"></label>
        <label class="field"><span>Photo</span><input class="input" id="fFile" type="file" accept="image/*"></label>
        <label class="field"><span>or image url</span><input class="input" id="fImg" placeholder="https://…"></label>
        <label class="row" style="margin:6px 0 14px">
          <input type="checkbox" id="fActive" checked>
          <span class="tag">Visible in the shop</span>
        </label>
        <div id="itemMsg"></div>
        <button class="btn" id="saveItem">${editing ? "Save changes" : "Add item"}</button>
      </div>

      <div class="panel">
        <div class="panel-head"><span class="tag tag-ink">Catalogue</span><span class="tag">${ITEMS.length} items</span></div>
        ${ITEMS.length ? `
        <table class="grid-table">
          <thead><tr><th></th><th>Item</th><th>Rail</th><th>Price</th><th>Stock</th><th></th></tr></thead>
          <tbody>${ITEMS.map((p) => `
            <tr>
              <td>${p.image_url ? `<img class="thumb" src="${escapeHtml(p.image_url)}" alt="">` : `<div class="thumb"></div>`}</td>
              <td><b>${escapeHtml(p.name)}</b><br><span class="mini">${escapeHtml(p.sku)}</span>${p.active ? "" : ` <span class="mini sold-out">hidden</span>`}</td>
              <td class="mini">${escapeHtml(p.collection)}${
                p.keywords?.length ? `<br><span style="color:var(--ink-soft)">${escapeHtml(p.keywords.join(" · "))}</span>` : ""}</td>
              <td class="mini">${money(p.price_cents, p.currency)}</td>
              <td class="mini">${p.variants?.length
                ? p.variants.map((v) => `${escapeHtml(v.size)}&nbsp;${v.stock}`).join("<br>")
                : p.stock}</td>
              <td class="row">
                <button class="tab" data-edit="${p.id}" style="padding:2px 6px">Edit</button>
                <button class="tab" data-sizes="${p.id}" style="padding:2px 6px">Sizes</button>
                <button class="tab" data-del="${p.id}" style="padding:2px 6px">Delete</button>
              </td>
            </tr>`).join("")}</tbody>
        </table>` : `<p class="empty">No items yet. Add the first one on the left.</p>`}
      </div>
    </div>`;

  if (editing) {
    $("fSku").value = editing.sku; $("fName").value = editing.name;
    $("fBlurb").value = editing.blurb || ""; $("fPrice").value = eur(editing.price_cents);
    $("fStock").value = editing.stock; $("fColl").value = editing.collection;
    $("fPos").value = editing.position; $("fImg").value = editing.image_url || "";
    $("fKeys").value = (editing.keywords || []).join(", ");
    $("fActive").checked = editing.active;
    $("cancelEdit").addEventListener("click", () => { editing = null; paintItems(); });
  }

  $("saveItem").addEventListener("click", saveItem);
  document.querySelectorAll("[data-edit]").forEach((b) =>
    b.addEventListener("click", () => { editing = ITEMS.find((p) => p.id === b.dataset.edit); paintItems(); window.scrollTo({ top: 0, behavior: "smooth" }); }));
  document.querySelectorAll("[data-sizes]").forEach((b) =>
    b.addEventListener("click", () => openSizes(ITEMS.find((p) => p.id === b.dataset.sizes))));
  document.querySelectorAll("[data-del]").forEach((b) =>
    b.addEventListener("click", async () => {
      if (!confirm("Delete this item? Orders that include it are kept.")) return;
      await sb.from("products").delete().eq("id", b.dataset.del);
      loadItems();
    }));
}

/* ---------------- size editor ----------------
   Sizes live in their own table, so a shirt can run out of M while L
   stays on the shelf. A product with no rows here behaves as before:
   one price, one stock figure, no size picker in the shop. */
const SIZE_PRESET = ["XS", "S", "M", "L", "XL", "XXL"];

function openSizes(product) {
  if (!product) return;
  const rows = product.variants || [];
  modalOpen(`
    <span class="tag">${escapeHtml(product.sku)}</span>
    <h2 style="margin:8px 0 4px">Sizes</h2>
    <p class="mini" style="color:var(--ink-soft);margin:0 0 16px">
      Leave the price blank to use the item price of ${money(product.price_cents, product.currency)}.
      Remove every size to sell this item unsized.</p>
    <table class="grid-table" id="sizeTable">
      <thead><tr><th>Size</th><th>Stock</th><th>Price</th><th></th></tr></thead>
      <tbody>${rows.map((v) => `
        <tr data-vid="${v.id}">
          <td><input class="input" style="width:70px" data-f="size" value="${escapeHtml(v.size)}"></td>
          <td><input class="input" style="width:70px" type="number" min="0" data-f="stock" value="${v.stock}"></td>
          <td><input class="input" style="width:90px" type="number" step="0.01" min="0" data-f="price"
                     value="${v.price_cents != null ? (v.price_cents / 100).toFixed(2) : ""}" placeholder="—"></td>
          <td><button class="tab" data-drop-v="${v.id}" style="padding:2px 6px">Remove</button></td>
        </tr>`).join("")}</tbody>
    </table>
    <div class="row" style="margin:16px 0">
      ${SIZE_PRESET.map((z) => `<button class="chip" data-add-size="${z}">+ ${z}</button>`).join("")}
    </div>
    <div id="sizeMsg"></div>
    <button class="btn" id="sizeSave">Save sizes</button>`);

  document.querySelectorAll("[data-add-size]").forEach((b) =>
    b.addEventListener("click", () => addSizeRow(product, b.dataset.addSize)));
  document.querySelectorAll("[data-drop-v]").forEach((b) =>
    b.addEventListener("click", async () => {
      if (!confirm("Remove this size? Past orders keep their record.")) return;
      await sb.from("product_variants").delete().eq("id", b.dataset.dropV);
      await loadItems();
      openSizes(ITEMS.find((x) => x.id === product.id));
    }));
  document.getElementById("sizeSave").addEventListener("click", () => saveSizes(product));
}

async function addSizeRow(product, size) {
  if ((product.variants || []).some((v) => v.size === size)) return;
  const { error } = await sb.from("product_variants").insert({
    product_id: product.id, size, stock: 0,
    position: SIZE_PRESET.indexOf(size),
    sku: `${product.sku}-${size}`,
  });
  if (error) { document.getElementById("sizeMsg").innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
  await loadItems();
  openSizes(ITEMS.find((x) => x.id === product.id));
}

async function saveSizes(product) {
  const msg = document.getElementById("sizeMsg");
  const updates = [...document.querySelectorAll("#sizeTable tbody tr")].map((tr) => {
    const val = (f) => tr.querySelector(`[data-f="${f}"]`).value.trim();
    const price = val("price");
    return {
      id: tr.dataset.vid,
      size: val("size"),
      stock: parseInt(val("stock") || "0", 10),
      price_cents: price === "" ? null : Math.round(parseFloat(price) * 100),
    };
  });
  for (const u of updates) {
    const { id, ...fields } = u;
    const { error } = await sb.from("product_variants").update(fields).eq("id", id);
    if (error) { msg.innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
  }
  await loadItems();
  msg.innerHTML = `<p class="notice">Saved.</p>`;
}

/* ---------------- modal shell ---------------- */
function modalOpen(html) {
  let m = document.getElementById("adminModal");
  if (!m) {
    m = document.createElement("div");
    m.id = "adminModal"; m.className = "modal";
    m.innerHTML = `<div class="modal-card" style="width:min(560px,100%)"></div>`;
    document.body.appendChild(m);
    m.addEventListener("click", (e) => { if (e.target === m) m.classList.remove("open"); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") m.classList.remove("open"); });
  }
  m.querySelector(".modal-card").innerHTML = html;
  m.classList.add("open");
}

async function saveItem() {
  const msg = $("itemMsg");
  const sku = $("fSku").value.trim(), name = $("fName").value.trim();
  if (!sku || !name) { msg.innerHTML = `<p class="notice notice-bad">A code and a name are required.</p>`; return; }

  let image_url = $("fImg").value.trim() || null;
  const file = $("fFile").files[0];
  if (file) {
    msg.innerHTML = `<p class="notice">Uploading the photo…</p>`;
    const path = `${sku.toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${Date.now()}.${file.name.split(".").pop()}`;
    const { error: upErr } = await sb.storage.from("product-images").upload(path, file, { upsert: true });
    if (upErr) { msg.innerHTML = `<p class="notice notice-bad">${escapeHtml(upErr.message)}</p>`; return; }
    image_url = sb.storage.from("product-images").getPublicUrl(path).data.publicUrl;
  }

  const row = {
    sku, name,
    blurb: $("fBlurb").value.trim() || null,
    price_cents: Math.round(parseFloat($("fPrice").value || "0") * 100),
    stock: parseInt($("fStock").value || "0", 10),
    collection: $("fColl").value.trim() || "shirts",
    position: parseInt($("fPos").value || "0", 10),
    active: $("fActive").checked,
    currency: cfg.CURRENCY,
    keywords: [...new Set($("fKeys").value.split(",")
      .map((k) => k.trim().toLowerCase()).filter(Boolean))],
  };
  if (image_url) row.image_url = image_url;

  const { error } = editing
    ? await sb.from("products").update(row).eq("id", editing.id)
    : await sb.from("products").insert(row);

  if (error) { msg.innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
  editing = null;
  await loadItems();
  await loadCodes();
}

/* ================= garment codes ================= */
let CODES = [];

async function loadCodes() {
  const { data } = await sb.from("garment_codes")
    .select("code,item_number,product_id,claimed_by,claimed_at")
    .order("created_at", { ascending: false }).limit(400);
  CODES = data || [];
  paintCodes();
}

/* 80 bits of randomness, no ambiguous characters (no 0/O, 1/I). */
function newToken(n = 16) {
  const abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const bytes = crypto.getRandomValues(new Uint8Array(n));
  return Array.from(bytes, (b) => abc[b % 32]).join("");
}

function paintCodes() {
  const claimed = CODES.filter((c) => c.claimed_by).length;
  $("tabCodes").innerHTML = `
    <div class="admin-grid">
      <div class="panel no-print">
        <div class="panel-head"><span class="tag tag-ink">Print a run</span></div>
        <p class="mini" style="color:var(--ink-soft);line-height:1.6">Each garment gets its own code.
          Print it large on the back — 8 cm or more, so it reads across a room. Once someone claims it, later scans go straight to the shop.</p>
        <label class="field"><span>Item</span>
          <select class="input" id="gProduct">
            ${ITEMS.map((p) => `<option value="${p.id}" data-sku="${escapeHtml(p.sku)}">${escapeHtml(p.name)}</option>`).join("")}
          </select></label>
        <div class="row">
          <label class="field" style="flex:1"><span>How many</span><input class="input" id="gCount" type="number" min="1" max="200" value="12"></label>
          <label class="field" style="flex:1"><span>Serial starts at</span><input class="input" id="gStart" type="number" min="1" value="1"></label>
        </div>
        <div id="genMsg"></div>
        <button class="btn" id="genGo" ${ITEMS.length ? "" : "disabled"}>Generate codes</button>
        ${ITEMS.length ? "" : `<p class="notice notice-bad">Add an item first.</p>`}
      </div>

      <div class="panel">
        <div class="panel-head no-print">
          <span class="tag tag-ink">Codes</span>
          <span class="tag">${CODES.length} printed · ${claimed} claimed</span>
          <button class="tab no-print" id="wipeBtn" style="margin-left:auto">Delete unclaimed</button>
          <button class="tab no-print" id="printBtn">Print sheet</button>
        </div>
        <div id="codeMsg"></div>
        <div class="qr-sheet" id="qrSheet"></div>
        ${CODES.length ? "" : `<p class="empty">No codes yet.</p>`}
      </div>
    </div>`;

  $("printBtn")?.addEventListener("click", () => window.print());
  $("genGo")?.addEventListener("click", generateCodes);
  $("wipeBtn")?.addEventListener("click", wipeUnclaimed);
  paintSheet();
}

/* Claimed codes are never touched: deleting one would orphan a garment
   that is already sewn shut and can then never be claimed by anyone. */
async function wipeUnclaimed() {
  const unclaimed = CODES.filter((c) => !c.claimed_by).length;
  if (!unclaimed) { $("codeMsg").innerHTML = `<p class="notice">Every code is claimed. Nothing to delete.</p>`; return; }
  if (!confirm(`Delete ${unclaimed} unclaimed codes? Claimed garments are kept.`)) return;

  const { error } = await sb.from("garment_codes").delete().is("claimed_by", null);
  if (error) { $("codeMsg").innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
  await loadCodes();
  $("codeMsg").innerHTML = `<p class="notice">Deleted ${unclaimed} codes.</p>`;
}

/* Deleting a claimed code cuts a real garment loose: the label is already
   sewn in, so that shirt can never be scanned again and its owner stops
   earning from it. Two gates, the second one deliberately awkward.
   Past payouts survive — the ledger keeps the rows and only loses the link. */
async function deleteClaimedCode(code, serial) {
  const first = confirm(
    `${serial} is CLAIMED.\n\n` +
    `Someone owns this garment. Deleting the code means:\n` +
    `  · the QR sewn into that shirt stops working, permanently\n` +
    `  · its owner earns nothing from it again\n` +
    `  · credit already paid is kept, but loses its link to this garment\n\n` +
    `There is no undo. Continue?`);
  if (!first) return;

  const typed = prompt(
    `Second check.\n\nType the serial exactly to confirm deletion:\n${serial}`);
  if (typed === null) return;
  if (typed.trim().toLowerCase() !== serial.toLowerCase()) {
    $("codeMsg").innerHTML = `<p class="notice notice-bad">That did not match ${escapeHtml(serial)}. Nothing was deleted.</p>`;
    return;
  }

  const { error } = await sb.from("garment_codes").delete().eq("code", code);
  if (error) { $("codeMsg").innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
  await loadCodes();
  $("codeMsg").innerHTML = `<p class="notice notice-bad">Deleted ${escapeHtml(serial)}. That garment is now unscannable.</p>`;
}

async function deleteCode(code) {
  if (!confirm(`Delete ${code}? Only do this if the label was never printed.`)) return;
  const { error } = await sb.from("garment_codes").delete().eq("code", code).is("claimed_by", null);
  if (error) { $("codeMsg").innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
  loadCodes();
}

function paintSheet() {
  const sheet = $("qrSheet");
  if (!sheet) return;
  sheet.innerHTML = "";

  if (!window.QRCode) {
    sheet.innerHTML = `<p class="notice notice-bad" style="grid-column:1/-1">
      The QR library did not load, so the codes below cannot be drawn.
      Check your connection and reload. The codes themselves are safely
      stored — nothing was lost.</p>`;
    return;
  }

  CODES.slice(0, 120).forEach((c) => {
    const cell = document.createElement("div");
    cell.className = "qr-cell";
    cell.innerHTML = `<canvas></canvas>
      <span class="redaction qr-brand">${escapeHtml(cfg.BRAND)}</span>
      <span class="serial">${escapeHtml(c.item_number)}</span>
      <span class="tag no-print" style="font-size:0.62rem">${c.claimed_by ? "claimed" : "unclaimed"}</span>
      ${c.claimed_by
        ? `<button class="tab no-print danger" data-drop-claimed="${escapeHtml(c.code)}" data-serial="${escapeHtml(c.item_number)}" style="padding:2px 6px;font-size:0.62rem">Delete</button>`
        : `<button class="tab no-print" data-drop="${escapeHtml(c.code)}" style="padding:2px 6px;font-size:0.62rem">Delete</button>`}`;
    sheet.appendChild(cell);
    const drop = cell.querySelector("[data-drop]");
    if (drop) drop.addEventListener("click", () => deleteCode(drop.dataset.drop));
    const dropC = cell.querySelector("[data-drop-claimed]");
    if (dropC) dropC.addEventListener("click", () =>
      deleteClaimedCode(dropC.dataset.dropClaimed, dropC.dataset.serial));
    const url = `${cfg.SITE_URL}/q.html?i=${encodeURIComponent(c.item_number)}&c=${encodeURIComponent(c.code)}`;
    window.QRCode.toCanvas(cell.querySelector("canvas"), url,
      { width: 320, margin: 1, errorCorrectionLevel: "H",
        color: { dark: "#14161A", light: "#ffffff" } },
      (err) => { if (err) console.error("QR draw failed:", err); });
  });
}

async function generateCodes() {
  const msg = $("genMsg");
  const sel = $("gProduct");
  const product_id = sel.value;
  const sku = sel.selectedOptions[0].dataset.sku;
  const count = Math.min(200, Math.max(1, parseInt($("gCount").value || "1", 10)));
  const start = Math.max(1, parseInt($("gStart").value || "1", 10));

  const rows = Array.from({ length: count }, (_, k) => ({
    code: newToken(),
    item_number: `${sku}-${String(start + k).padStart(4, "0")}`,
    product_id,
  }));

  msg.innerHTML = `<p class="notice">Writing ${count} codes…</p>`;
  const { error } = await sb.from("garment_codes").insert(rows);
  if (error) { msg.innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
  msg.innerHTML = `<p class="notice">${count} codes ready. Print the sheet on the right.</p>`;
  $("gStart").value = start + count;
  loadCodes();
}

/* ================= orders =================
   Payment and fulfilment are tracked separately, so a paid order sits in
   the queue until you put it in a box. Each row opens to a packing list. */
let ORDERS = [];
let ORDER_FILTER = "topack";
let OPEN_ORDER = null;

async function loadOrders() {
  const { data: orders } = await sb.from("orders")
    .select("id,email,status,fulfillment,subtotal_cents,credit_applied_cents,total_cents,referral_code,tracking,ship_name,ship_address,created_at,shipped_at,received_at")
    .order("created_at", { ascending: false }).limit(200);

  const rows = orders || [];
  let items = [];
  if (rows.length) {
    const { data } = await sb.from("order_items")
      .select("order_id,name,size,quantity,unit_price_cents")
      .in("order_id", rows.map((o) => o.id));
    items = data || [];
  }
  ORDERS = rows.map((o) => ({ ...o, items: items.filter((i) => i.order_id === o.id) }));
  paintOrders();
}

const FILTERS = [
  ["topack",   "To pack"],
  ["shipped",  "Shipped"],
  ["received", "Received"],
  ["all",      "All"],
];

function filterOrders() {
  if (ORDER_FILTER === "all") return ORDERS;
  if (ORDER_FILTER === "topack")
    return ORDERS.filter((o) => o.status === "paid" && o.fulfillment === "unfulfilled");
  return ORDERS.filter((o) => o.fulfillment === ORDER_FILTER);
}

function addressLines(o) {
  const a = o.ship_address;
  if (!a) return null;
  return [o.ship_name, a.line1, a.line2, [a.postal_code, a.city].filter(Boolean).join(" "),
          a.state, a.country].filter(Boolean);
}

function paintOrders() {
  const rows = filterOrders();
  const paid = ORDERS.filter((o) => o.status === "paid");
  const gross = paid.reduce((s, o) => s + o.subtotal_cents, 0);
  const toPack = ORDERS.filter((o) => o.status === "paid" && o.fulfillment === "unfulfilled").length;

  $("tabOrders").innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <span class="tag tag-ink">Orders</span>
        <span class="tag">${paid.length} paid · ${money(gross)} gross · ${toPack} to pack</span>
      </div>
      <div class="row" style="margin-bottom:16px">
        ${FILTERS.map(([k, label]) =>
          `<button class="chip ${ORDER_FILTER === k ? "tag-chip on" : ""}" data-filter="${k}">${label}</button>`).join("")}
      </div>
      <div id="orderMsg"></div>
      ${rows.length ? rows.map(orderRow).join("") : `<p class="empty">Nothing here.</p>`}
    </div>`;

  document.querySelectorAll("[data-filter]").forEach((b) =>
    b.addEventListener("click", () => { ORDER_FILTER = b.dataset.filter; OPEN_ORDER = null; paintOrders(); }));
  document.querySelectorAll("[data-open]").forEach((b) =>
    b.addEventListener("click", () => {
      OPEN_ORDER = OPEN_ORDER === b.dataset.open ? null : b.dataset.open; paintOrders();
    }));
  document.querySelectorAll("[data-mark]").forEach((b) =>
    b.addEventListener("click", (e) => { e.stopPropagation(); markOrder(b.dataset.id, b.dataset.mark); }));
}

function orderRow(o) {
  const open = OPEN_ORDER === o.id;
  const badge = o.status !== "paid"
    ? `<span class="mini sold-out">${escapeHtml(o.status)}</span>`
    : `<span class="mini ship-${o.fulfillment}">${
        o.fulfillment === "unfulfilled" ? "to pack" : escapeHtml(o.fulfillment)}</span>`;
  const addr = addressLines(o);

  return `
    <div class="order-row ${open ? "open" : ""}">
      <button class="order-head" data-open="${o.id}">
        <span class="mini">${new Date(o.created_at).toLocaleDateString(cfg.LOCALE)}</span>
        <span class="mini" style="flex:1;text-align:left">${escapeHtml(o.email || "—")}</span>
        <span class="mini">${o.items.reduce((n, i) => n + i.quantity, 0)} pc</span>
        <span class="price">${money(o.total_cents)}</span>
        ${badge}
      </button>
      ${open ? `
      <div class="order-body">
        <div class="order-cols">
          <div>
            <span class="tag">Pack this</span>
            <ul class="pack-list">${o.items.map((i) => `
              <li><b>${i.quantity}&times;</b> ${escapeHtml(i.name)}${
                i.size ? ` <span class="tag">size ${escapeHtml(i.size)}</span>` : ""}</li>`).join("")}</ul>
          </div>
          <div>
            <span class="tag">Ship to</span>
            ${addr
              ? `<p class="mini" style="line-height:1.7;margin:6px 0 0">${addr.map(escapeHtml).join("<br>")}</p>`
              : `<p class="mini sold-out" style="margin:6px 0 0">No address recorded. Look this order up in Stripe.</p>`}
            ${o.referral_code ? `<p class="tag" style="margin-top:10px">Referred by ${escapeHtml(o.referral_code)}</p>` : ""}
            ${o.tracking ? `<p class="tag" style="margin-top:10px">Tracking ${escapeHtml(o.tracking)}</p>` : ""}
          </div>
        </div>
        ${o.status === "paid" ? `
        <div class="row" style="margin-top:16px">
          ${o.fulfillment === "unfulfilled"
            ? `<button class="btn btn-slim" data-mark="shipped" data-id="${o.id}">Mark shipped</button>` : ""}
          ${o.fulfillment === "shipped"
            ? `<button class="btn btn-slim" data-mark="received" data-id="${o.id}">Mark received</button>` : ""}
          ${o.fulfillment !== "unfulfilled"
            ? `<button class="btn btn-hollow btn-slim" data-mark="unfulfilled" data-id="${o.id}">Undo</button>` : ""}
        </div>` : `<p class="notice" style="margin-top:14px">Not paid, so nothing to send yet.</p>`}
      </div>` : ""}
    </div>`;
}

async function markOrder(id, state) {
  const patch = { fulfillment: state };
  if (state === "shipped") {
    patch.shipped_at = new Date().toISOString();
    const t = prompt("Tracking number, if you have one. Leave blank to skip.");
    if (t === null) return;
    if (t.trim()) patch.tracking = t.trim();
  }
  if (state === "received") patch.received_at = new Date().toISOString();
  if (state === "unfulfilled") { patch.shipped_at = null; patch.received_at = null; }

  const { error } = await sb.from("orders").update(patch).eq("id", id);
  if (error) { $("orderMsg").innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
  await loadOrders();
}

boot();
</script>
