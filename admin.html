<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back office</title>
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#EDEEE9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shop.css?v=8">
<script src="./config.js?v=8"></script>
<!-- 1.4.x is the last line that ships a prebuilt browser bundle; the
     build/ folder was dropped from 1.5 onward, so newer tags 404 here. -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
</head>
<body>

<header class="masthead">
  <div class="masthead-in">
    <a class="redaction" href="./index.html" id="brand"></a>
    <span class="tag">Back office</span>
    <nav class="masthead-nav">
      <span class="tag" id="whoami"></span>
      <button class="chip hide" id="outBtn">Sign out</button>
    </nav>
  </div>
</header>

<main class="shell" style="padding-top:26px;padding-bottom:60px">
  <div id="gate"></div>
  <div id="desk" class="hide">
    <div class="tabs">
      <button class="tab on" data-tab="items">Items</button>
      <button class="tab" data-tab="codes">Garment codes</button>
      <button class="tab" data-tab="orders">Orders</button>
      <button class="tab" data-tab="discounts">Discounts</button>
      <button class="tab" data-tab="subs">Subscribers</button>
      <button class="tab" data-tab="settings">Settings</button>
    </div>
    <div id="tabItems"></div>
    <div id="tabCodes" class="hide"></div>
    <div id="tabOrders" class="hide"></div>
    <div id="tabDiscounts" class="hide"></div>
    <div id="tabSubs" class="hide"></div>
    <div id="tabSettings" class="hide"></div>
  </div>
</main>

<script type="module">
import { cfg, sb, money, escapeHtml, currentUser, signIn, signOut } from "./shop.js?v=8";

document.getElementById("brand").textContent = cfg.BRAND;
const $ = (id) => document.getElementById(id);
const eur = (c) => (c / 100).toFixed(2);

/* ================= access gate ================= */
async function boot() {
  const user = await currentUser();
  if (!user) return gateSignIn();

  const { data: admin } = await sb.rpc("is_admin");
  if (!admin) {
    $("gate").innerHTML = `<p class="notice notice-bad">This account is not an administrator.
      Add its user id to the <span class="mini">admins</span> table in Supabase.</p>
      <p class="mini">Your user id: ${escapeHtml(user.id)}</p>`;
    showOut(user);
    return;
  }
  $("gate").classList.add("hide");
  $("desk").classList.remove("hide");
  showOut(user);
  loadItems(); loadCodes(); loadOrders(); loadDiscounts(); loadSettings(); loadSubs();
}

function showOut(user) {
  $("whoami").textContent = user.email;
  $("outBtn").classList.remove("hide");
  $("outBtn").addEventListener("click", async () => { await signOut(); location.reload(); });
}

function gateSignIn() {
  $("gate").innerHTML = `
    <div class="panel" style="max-width:380px">
      <div class="panel-head"><span class="tag tag-ink">Sign in</span></div>
      <label class="field"><span>Email</span><input class="input" id="gEmail" type="email"></label>
      <label class="field"><span>Password</span><input class="input" id="gPass" type="password"></label>
      <div id="gMsg"></div>
      <button class="btn" id="gGo">Sign in</button>
    </div>`;
  $("gGo").addEventListener("click", async () => {
    const { error } = await signIn($("gEmail").value.trim(), $("gPass").value);
    if (error) { $("gMsg").innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
    location.reload();
  });
}

/* ================= tabs ================= */
document.querySelectorAll(".tab").forEach((t) =>
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
    ["items", "codes", "orders", "discounts", "subs", "settings"].forEach((n) =>
      $(`tab${n[0].toUpperCase()}${n.slice(1)}`).classList.toggle("hide", n !== t.dataset.tab));
  }));

/* ================= items ================= */
let ITEMS = [];
let editing = null;

async function loadItems() {
  const { data, error } = await sb.from("products")
    .select("*, variants:product_variants(id,size,color,color_hex,sku,price_cents,stock,position,active)")
    .order("collection").order("position");
  if (error) { $("tabItems").innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
  ITEMS = (data || []).map((p) => ({
    ...p, variants: (p.variants || []).sort((a, b) => a.position - b.position) }));
  paintItems();
}

function paintItems() {
  $("tabItems").innerHTML = `
    <div class="admin-grid">
      <div class="panel">
        <div class="panel-head">
          <span class="tag tag-ink">${editing ? "Edit item" : "New item"}</span>
          ${editing ? `<button class="tab" id="cancelEdit" style="margin-left:auto;padding:0">Cancel</button>` : ""}
        </div>
        <label class="field"><span>Code (sku)</span><input class="input" id="fSku" placeholder="TEE-BLACK-M"></label>
        <label class="field"><span>Name</span><input class="input" id="fName" placeholder="Heavyweight tee"></label>
        <label class="field"><span>Description</span><textarea class="input" id="fBlurb" rows="3"></textarea></label>
        <div class="row">
          <label class="field" style="flex:1"><span>Price (${cfg.CURRENCY.toUpperCase()})</span><input class="input" id="fPrice" type="number" step="0.01" min="0" value="0.00"></label>
          <label class="field" style="flex:1"><span>Stock</span><input class="input" id="fStock" type="number" min="0" value="0"></label>
        </div>
        <div class="row">
          <label class="field" style="flex:1"><span>Rail</span><input class="input" id="fColl" value="shirts"></label>
          <label class="field" style="width:90px"><span>Order</span><input class="input" id="fPos" type="number" value="0"></label>
        </div>
        <label class="field"><span>Name (Italian)</span><input class="input" id="fNameIt" placeholder="optional"></label>
        <label class="field"><span>Description (Italian)</span><textarea class="input" id="fBlurbIt" rows="2"></textarea></label>
        <label class="field"><span>Keywords</span><input class="input" id="fKeys" placeholder="chilli, calabria, cotton"></label>
        <label class="field"><span>Photo</span><input class="input" id="fFile" type="file" accept="image/*"></label>
        <label class="field"><span>or image url</span><input class="input" id="fImg" placeholder="https://…"></label>
        <label class="row" style="margin:6px 0 14px">
          <input type="checkbox" id="fActive" checked>
          <span class="tag">Visible in the shop</span>
        </label>
        <div id="itemMsg"></div>
        <button class="btn" id="saveItem">${editing ? "Save changes" : "Add item"}</button>
      </div>

      <div class="panel">
        <div class="panel-head"><span class="tag tag-ink">Catalogue</span><span class="tag">${ITEMS.length} items</span></div>
        ${ITEMS.length ? `
        <table class="grid-table">
          <thead><tr><th></th><th>Item</th><th>Rail</th><th>Price</th><th>Stock</th><th></th></tr></thead>
          <tbody>${ITEMS.map((p) => `
            <tr>
              <td>${p.image_url ? `<img class="thumb" src="${escapeHtml(p.image_url)}" alt="">` : `<div class="thumb"></div>`}</td>
              <td><b>${escapeHtml(p.name)}</b><br><span class="mini">${escapeHtml(p.sku)}</span>${p.active ? "" : ` <span class="mini sold-out">hidden</span>`}</td>
              <td class="mini">${escapeHtml(p.collection)}${
                p.keywords?.length ? `<br><span style="color:var(--ink-soft)">${escapeHtml(p.keywords.join(" · "))}</span>` : ""}</td>
              <td class="mini">${money(p.price_cents, p.currency)}</td>
              <td class="mini">${p.variants?.length
                ? p.variants.map((v) => `${escapeHtml([v.color, v.size].filter(Boolean).join(" "))}&nbsp;${v.stock}`).join("<br>")
                : p.stock}</td>
              <td class="row">
                <button class="tab" data-edit="${p.id}" style="padding:2px 6px">Edit</button>
                <button class="tab" data-sizes="${p.id}" style="padding:2px 6px">Variants</button>
                <button class="tab" data-del="${p.id}" style="padding:2px 6px">Delete</button>
              </td>
            </tr>`).join("")}</tbody>
        </table>` : `<p class="empty">No items yet. Add the first one on the left.</p>`}
      </div>
    </div>`;

  if (editing) {
    $("fSku").value = editing.sku; $("fName").value = editing.name;
    $("fBlurb").value = editing.blurb || ""; $("fPrice").value = eur(editing.price_cents);
    $("fStock").value = editing.stock; $("fColl").value = editing.collection;
    $("fPos").value = editing.position; $("fImg").value = editing.image_url || "";
    $("fKeys").value = (editing.keywords || []).join(", ");
    $("fNameIt").value = editing.name_it || ""; $("fBlurbIt").value = editing.blurb_it || "";
    $("fActive").checked = editing.active;
    $("cancelEdit").addEventListener("click", () => { editing = null; paintItems(); });
  }

  $("saveItem").addEventListener("click", saveItem);
  document.querySelectorAll("[data-edit]").forEach((b) =>
    b.addEventListener("click", () => { editing = ITEMS.find((p) => p.id === b.dataset.edit); paintItems(); window.scrollTo({ top: 0, behavior: "smooth" }); }));
  document.querySelectorAll("[data-sizes]").forEach((b) =>
    b.addEventListener("click", () => openSizes(ITEMS.find((p) => p.id === b.dataset.sizes))));
  document.querySelectorAll("[data-del]").forEach((b) =>
    b.addEventListener("click", async () => {
      if (!confirm("Delete this item? Orders that include it are kept.")) return;
      await sb.from("products").delete().eq("id", b.dataset.del);
      loadItems();
    }));
}

/* ---------------- size editor ----------------
   Sizes live in their own table, so a shirt can run out of M while L
   stays on the shelf. A product with no rows here behaves as before:
   one price, one stock figure, no size picker in the shop. */
const SIZE_PRESET = ["XS", "S", "M", "L", "XL", "XXL"];

function openSizes(product) {
  if (!product) return;
  const rows = product.variants || [];
  modalOpen(`
    <span class="tag">${escapeHtml(product.sku)}</span>
    <h2 style="margin:8px 0 4px">Colours &amp; sizes</h2>
    <p class="mini" style="color:var(--ink-soft);margin:0 0 16px">
      Leave the price blank to use the item price of ${money(product.price_cents, product.currency)}.
      Remove every size to sell this item unsized.</p>
    <table class="grid-table" id="sizeTable">
      <thead><tr><th>Colour</th><th>Size</th><th>Stock</th><th>Price</th><th></th></tr></thead>
      <tbody>${rows.map((v) => `
        <tr data-vid="${v.id}">
          <td class="row" style="gap:4px">
            <input class="input" style="width:76px" data-f="color" value="${escapeHtml(v.color || "")}" placeholder="—">
            <input type="color" data-f="color_hex" value="${escapeHtml(v.color_hex || "#111111")}" style="width:30px;height:30px;border:1px solid var(--rule);padding:0;background:none">
          </td>
          <td><input class="input" style="width:64px" data-f="size" value="${escapeHtml(v.size || "")}"></td>
          <td><input class="input" style="width:70px" type="number" min="0" data-f="stock" value="${v.stock}"></td>
          <td><input class="input" style="width:90px" type="number" step="0.01" min="0" data-f="price"
                     value="${v.price_cents != null ? (v.price_cents / 100).toFixed(2) : ""}" placeholder="—"></td>
          <td><button class="tab" data-drop-v="${v.id}" style="padding:2px 6px">Remove</button></td>
        </tr>`).join("")}</tbody>
    </table>
    <div class="row" style="margin:16px 0 6px">
      <input class="input" id="newColour" placeholder="Colour to add, e.g. Black" style="flex:1">
      <input type="color" id="newHex" value="#111111" style="width:34px;height:34px;border:1px solid var(--rule);padding:0;background:none">
    </div>
    <div class="row" style="margin:0 0 16px">
      ${SIZE_PRESET.map((z) => `<button class="chip" data-add-size="${z}">+ ${z}</button>`).join("")}
    </div>
    <p class="mini" style="color:var(--ink-soft);margin:0 0 14px">
      Type a colour, then click a size to add that pairing. Leave the colour blank for
      an item that comes in one colour.</p>
    <div id="sizeMsg"></div>
    <button class="btn" id="sizeSave">Save sizes</button>`);

  document.querySelectorAll("[data-add-size]").forEach((b) =>
    b.addEventListener("click", () => addSizeRow(product, b.dataset.addSize)));
  document.querySelectorAll("[data-drop-v]").forEach((b) =>
    b.addEventListener("click", async () => {
      if (!confirm("Remove this size? Past orders keep their record.")) return;
      await sb.from("product_variants").delete().eq("id", b.dataset.dropV);
      await loadItems();
      openSizes(ITEMS.find((x) => x.id === product.id));
    }));
  document.getElementById("sizeSave").addEventListener("click", () => saveSizes(product));
}

async function addSizeRow(product, size) {
  const colour = document.getElementById("newColour")?.value.trim() || null;
  const hex    = document.getElementById("newHex")?.value || null;
  if ((product.variants || []).some((v) => v.size === size && (v.color || null) === colour)) return;
  const { error } = await sb.from("product_variants").insert({
    product_id: product.id, size, color: colour, color_hex: colour ? hex : null, stock: 0,
    position: SIZE_PRESET.indexOf(size),
    sku: [product.sku, colour, size].filter(Boolean).join("-").toUpperCase().replace(/\s+/g, ""),
  });
  if (error) { document.getElementById("sizeMsg").innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
  await loadItems();
  openSizes(ITEMS.find((x) => x.id === product.id));
}

async function saveSizes(product) {
  const msg = document.getElementById("sizeMsg");
  const updates = [...document.querySelectorAll("#sizeTable tbody tr")].map((tr) => {
    const val = (f) => tr.querySelector(`[data-f="${f}"]`).value.trim();
    const price = val("price");
    const colour = val("color");
    return {
      id: tr.dataset.vid,
      size: val("size") || null,
      color: colour || null,
      color_hex: colour ? val("color_hex") : null,
      stock: parseInt(val("stock") || "0", 10),
      price_cents: price === "" ? null : Math.round(parseFloat(price) * 100),
    };
  });
  for (const u of updates) {
    const { id, ...fields } = u;
    const { error } = await sb.from("product_variants").update(fields).eq("id", id);
    if (error) { msg.innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
  }
  await loadItems();
  msg.innerHTML = `<p class="notice">Saved.</p>`;
}

/* ---------------- modal shell ---------------- */
function modalOpen(html) {
  let m = document.getElementById("adminModal");
  if (!m) {
    m = document.createElement("div");
    m.id = "adminModal"; m.className = "modal";
    m.innerHTML = `<div class="modal-card" style="width:min(560px,100%)"></div>`;
    document.body.appendChild(m);
    m.addEventListener("click", (e) => { if (e.target === m) m.classList.remove("open"); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") m.classList.remove("open"); });
  }
  m.querySelector(".modal-card").innerHTML = html;
  m.classList.add("open");
}

async function saveItem() {
  const msg = $("itemMsg");
  const sku = $("fSku").value.trim(), name = $("fName").value.trim();
  if (!sku || !name) { msg.innerHTML = `<p class="notice notice-bad">A code and a name are required.</p>`; return; }

  let image_url = $("fImg").value.trim() || null;
  const file = $("fFile").files[0];
  if (file) {
    msg.innerHTML = `<p class="notice">Uploading the photo…</p>`;
    const path = `${sku.toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${Date.now()}.${file.name.split(".").pop()}`;
    const { error: upErr } = await sb.storage.from("product-images").upload(path, file, { upsert: true });
    if (upErr) { msg.innerHTML = `<p class="notice notice-bad">${escapeHtml(upErr.message)}</p>`; return; }
    image_url = sb.storage.from("product-images").getPublicUrl(path).data.publicUrl;
  }

  const row = {
    sku, name,
    blurb: $("fBlurb").value.trim() || null,
    price_cents: Math.round(parseFloat($("fPrice").value || "0") * 100),
    stock: parseInt($("fStock").value || "0", 10),
    collection: $("fColl").value.trim() || "shirts",
    position: parseInt($("fPos").value || "0", 10),
    active: $("fActive").checked,
    currency: cfg.CURRENCY,
    name_it: $("fNameIt").value.trim() || null,
    blurb_it: $("fBlurbIt").value.trim() || null,
    keywords: [...new Set($("fKeys").value.split(",")
      .map((k) => k.trim().toLowerCase()).filter(Boolean))],
  };
  if (image_url) row.image_url = image_url;

  const { error } = editing
    ? await sb.from("products").update(row).eq("id", editing.id)
    : await sb.from("products").insert(row);

  if (error) { msg.innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
  editing = null;
  await loadItems();
  await loadCodes();
}

/* ================= garment codes =================
   A list, not a wall of QR images: at a hundred garments the grid stops
   being readable. Click a row for the code, who holds it and where it went. */
let CODES = [];
let CODE_FILTER = "all";
let CODE_QUERY = "";

async function loadCodes() {
  const { data } = await sb.from("garment_codes")
    .select("code,item_number,product_id,size,color,claimed_by,claimed_at,order_id,created_at")
    .order("created_at", { ascending: false }).limit(500);
  CODES = data || [];
  paintCodes();
}

function newToken(n = 16) {
  const abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => abc[b % 32]).join("");
}

const CODE_FILTERS = [
  ["all",       "All"],
  ["sold",      "Sold"],
  ["unsold",    "Not sold"],
  ["claimed",   "Claimed"],
  ["unclaimed", "Unclaimed"],
];

function filterCodes() {
  let rows = CODES;
  if (CODE_FILTER === "sold")      rows = rows.filter((c) => c.order_id);
  if (CODE_FILTER === "unsold")    rows = rows.filter((c) => !c.order_id);
  if (CODE_FILTER === "claimed")   rows = rows.filter((c) => c.claimed_by);
  if (CODE_FILTER === "unclaimed") rows = rows.filter((c) => !c.claimed_by);
  if (CODE_QUERY) {
    const q = CODE_QUERY.toLowerCase();
    rows = rows.filter((c) => (c.item_number + " " + c.code).toLowerCase().includes(q));
  }
  return rows;
}

function paintCodes() {
  const rows = filterCodes();
  const sold = CODES.filter((c) => c.order_id).length;
  const claimed = CODES.filter((c) => c.claimed_by).length;

  $("tabCodes").innerHTML = `
    <div class="admin-grid">
      <div class="panel">
        <div class="panel-head"><span class="tag tag-ink">Issue by hand</span></div>
        <p class="mini" style="color:var(--ink-soft);line-height:1.6;margin-top:0">
          Serials are minted automatically when an order is paid, so you rarely need this.
          Use it only for samples, gifts or stock printed ahead of time.</p>
        <label class="field"><span>Item</span>
          <select class="input" id="gProduct">
            ${ITEMS.map((p) => `<option value="${p.id}" data-sku="${escapeHtml(p.sku)}">${escapeHtml(p.name)}</option>`).join("")}
          </select></label>
        <div class="row">
          <label class="field" style="flex:1"><span>How many</span><input class="input" id="gCount" type="number" min="1" max="200" value="5"></label>
          <label class="field" style="flex:1"><span>Serial starts at</span><input class="input" id="gStart" type="number" min="1" value="1"></label>
        </div>
        <div id="genMsg"></div>
        <button class="btn" id="genGo" ${ITEMS.length ? "" : "disabled"}>Generate</button>
      </div>

      <div class="panel">
        <div class="panel-head">
          <span class="tag tag-ink">Garments</span>
          <span class="tag">${CODES.length} issued · ${sold} sold · ${claimed} claimed</span>
        </div>
        <div class="row" style="margin-bottom:14px">
          <input class="input" id="codeSearch" placeholder="Search serial" style="flex:1" value="${escapeHtml(CODE_QUERY)}">
          ${CODE_FILTERS.map(([k, l]) =>
            `<button class="chip ${CODE_FILTER === k ? "tag-chip on" : ""}" data-cf="${k}">${l}</button>`).join("")}
        </div>
        <div id="codeMsg"></div>
        ${rows.length ? `
        <table class="grid-table">
          <thead><tr><th>Serial</th><th>Variant</th><th>Sold</th><th>Claimed</th><th></th></tr></thead>
          <tbody>${rows.map((c) => `
            <tr>
              <td><b class="mini">${escapeHtml(c.item_number)}</b></td>
              <td class="mini">${escapeHtml([c.color, c.size].filter(Boolean).join(" ") || "—")}</td>
              <td class="mini ${c.order_id ? "" : "ship-received"}">${c.order_id ? "yes" : "—"}</td>
              <td class="mini ${c.claimed_by ? "ship-shipped" : "ship-unfulfilled"}">${c.claimed_by ? "yes" : "no"}</td>
              <td><button class="tab" data-detail="${escapeHtml(c.code)}" style="padding:2px 6px">Open</button></td>
            </tr>`).join("")}</tbody>
        </table>` : `<p class="empty">Nothing matches.</p>`}
      </div>
    </div>`;

  $("genGo")?.addEventListener("click", generateCodes);
  $("codeSearch")?.addEventListener("input", (e) => {
    CODE_QUERY = e.target.value;
    const pos = e.target.selectionStart;
    paintCodes();
    const el = $("codeSearch"); el.focus(); el.setSelectionRange(pos, pos);
  });
  document.querySelectorAll("[data-cf]").forEach((b) =>
    b.addEventListener("click", () => { CODE_FILTER = b.dataset.cf; paintCodes(); }));
  document.querySelectorAll("[data-detail]").forEach((b) =>
    b.addEventListener("click", () => openCode(b.dataset.detail)));
}

async function openCode(code) {
  const { data: d } = await sb.rpc("admin_code_detail", { p_code: code });
  if (!d?.ok) { $("codeMsg").innerHTML = `<p class="notice notice-bad">Could not open that serial.</p>`; return; }

  const a = d.order?.ship_address || {};
  const address = [d.order?.ship_name, a.line1, a.line2,
                   [a.postal_code, a.city].filter(Boolean).join(" "), a.state, a.country]
                  .filter(Boolean).map(escapeHtml).join("<br>");

  modalOpen(`
    <div class="code-detail">
      <div>
        <canvas id="qrBig" style="width:100%;background:#fff"></canvas>
        <p class="serial" style="text-align:center;margin:10px 0 0">${escapeHtml(d.item_number)}</p>
        <p class="tag" style="text-align:center">${escapeHtml([d.color, d.size].filter(Boolean).join(" ") || "")}</p>
        <button class="chip" id="qrDl" style="width:100%;margin-top:10px;justify-content:center">Download PNG</button>
      </div>
      <div>
        <span class="tag">${escapeHtml(d.product?.name || "Unknown item")}</span>
        <h2 style="margin:6px 0 16px;font-size:1.3rem">${d.sold ? "Sold" : "Not sold"}</h2>

        ${d.sold ? `
          <div class="total-row"><span class="tag">Paid</span><span class="price">${money(d.line?.unit_price_cents || 0)}</span></div>
          <div class="total-row"><span class="tag">Order</span><span class="mini">${escapeHtml(String(d.order.id).slice(0, 8))}</span></div>
          <div class="total-row"><span class="tag">Status</span><span class="mini">${escapeHtml(d.order.fulfillment)}</span></div>
          ${d.order.tracking ? `<div class="total-row"><span class="tag">Tracking</span><span class="mini">${escapeHtml(d.order.tracking)}</span></div>` : ""}
          <p class="tag" style="margin-top:14px">Buyer</p>
          <p class="mini" style="margin:4px 0 0">${escapeHtml(d.order.email || "—")}</p>
          <p class="tag" style="margin-top:12px">Shipped to</p>
          <p class="mini" style="line-height:1.7;margin:4px 0 0">${address || "No address recorded"}</p>
        ` : `<p class="mini" style="color:var(--ink-soft)">This serial was issued by hand and has not been sold through the shop.</p>`}

        <p class="tag" style="margin-top:18px">Owner</p>
        <p class="mini" style="margin:4px 0 0">${d.claimed
          ? `${escapeHtml(d.owner_email || "claimed")}<br><span style="color:var(--ink-soft)">since ${new Date(d.claimed_at).toLocaleDateString(cfg.LOCALE)}</span>`
          : "<span style='color:var(--ink-soft)'>Not claimed yet</span>"}</p>

        ${d.history?.length ? `
          <p class="tag" style="margin-top:18px">History</p>
          <p class="mini" style="line-height:1.7;margin:4px 0 0">${d.history.map((h) =>
            `${escapeHtml(h.event)} · ${new Date(h.at).toLocaleDateString(cfg.LOCALE)}`).join("<br>")}</p>` : ""}

        <button class="tab danger" id="delCode" style="margin-top:22px;padding:6px 10px">Delete this serial</button>
      </div>
    </div>`);

  document.getElementById("delCode").addEventListener("click", () => deleteSerial(d));

  const url = `${cfg.SITE_URL}/q.html?i=${encodeURIComponent(d.item_number)}&c=${encodeURIComponent(d.code)}`;
  const canvas = document.getElementById("qrBig");
  window.QRCode?.toCanvas(canvas, url,
    { width: 600, margin: 1, errorCorrectionLevel: "H", color: { dark: "#14161A", light: "#ffffff" } },
    (err) => { if (err) console.error(err); });

  document.getElementById("qrDl").addEventListener("click", () => {
    const a2 = document.createElement("a");
    a2.href = canvas.toDataURL("image/png");
    a2.download = `${d.item_number}.png`;
    a2.click();
  });
}

/* Deleting a serial cuts a real garment loose: its QR stops working for
   good, and if someone owns it they stop earning from it. Two gates, the
   second deliberately awkward. Past payouts survive — the ledger keeps its
   rows and only loses the link. */
async function deleteSerial(d) {
  const consequences = d.claimed
    ? `${d.item_number} is CLAIMED by ${d.owner_email || "someone"}.\n\n` +
      `  · the QR on that shirt stops working, permanently\n` +
      `  · its owner earns nothing from it again\n` +
      `  · credit already paid is kept, but loses its link\n\n`
    : `${d.item_number} has not been claimed.\n\n` +
      (d.sold ? `  · it was sold, so a real garment exists carrying this code\n` +
                `  · whoever receives it will never be able to claim it\n\n` : "");

  if (!confirm(consequences + "There is no undo. Continue?")) return;

  const typed = prompt(`Second check.\n\nType the serial exactly to confirm:\n${d.item_number}`);
  if (typed === null) return;
  if (typed.trim().toLowerCase() !== d.item_number.toLowerCase()) {
    $("codeMsg").innerHTML = `<p class="notice notice-bad">That did not match ${escapeHtml(d.item_number)}. Nothing was deleted.</p>`;
    document.getElementById("adminModal")?.classList.remove("open");
    return;
  }

  const { error } = await sb.from("garment_codes").delete().eq("code", d.code);
  document.getElementById("adminModal")?.classList.remove("open");
  if (error) { $("codeMsg").innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
  await loadCodes();
  $("codeMsg").innerHTML = `<p class="notice notice-bad">Deleted ${escapeHtml(d.item_number)}. That garment is now unscannable.</p>`;
}

async function generateCodes() {
  const msg = $("genMsg");
  const sel = $("gProduct");
  const sku = sel.selectedOptions[0].dataset.sku;
  const count = Math.min(200, Math.max(1, parseInt($("gCount").value || "1", 10)));
  const start = Math.max(1, parseInt($("gStart").value || "1", 10));

  const rows = Array.from({ length: count }, (_, k) => ({
    code: newToken(),
    item_number: `${sku}-${String(start + k).padStart(4, "0")}`,
    serial_no: start + k,
    product_id: sel.value,
  }));

  const { error } = await sb.from("garment_codes").insert(rows);
  if (error) { msg.innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
  msg.innerHTML = `<p class="notice">${count} issued.</p>`;
  $("gStart").value = start + count;
  loadCodes();
}

/* ================= orders =================
   Payment and fulfilment are tracked separately, so a paid order sits in
   the queue until you put it in a box. Each row opens to a packing list. */
let ORDERS = [];
let ORDER_FILTER = "topack";
let OPEN_ORDER = null;

async function loadOrders() {
  const { data: orders } = await sb.from("orders")
    .select("id,email,status,fulfillment,subtotal_cents,discount_cents,discount_code,shipping_cents,handling_cents,credit_applied_cents,total_cents,referral_code,tracking,ship_name,ship_address,created_at,shipped_at,received_at")
    .order("created_at", { ascending: false }).limit(200);

  const rows = orders || [];
  let items = [];
  if (rows.length) {
    const { data } = await sb.from("order_items")
      .select("order_id,name,size,quantity,unit_price_cents")
      .in("order_id", rows.map((o) => o.id));
    items = data || [];
  }
  ORDERS = rows.map((o) => ({ ...o, items: items.filter((i) => i.order_id === o.id) }));
  paintOrders();
}

const FILTERS = [
  ["topack",   "To pack"],
  ["shipped",  "Shipped"],
  ["received", "Received"],
  ["all",      "All"],
];

function filterOrders() {
  if (ORDER_FILTER === "all") return ORDERS;
  if (ORDER_FILTER === "topack")
    return ORDERS.filter((o) => o.status === "paid" && o.fulfillment === "unfulfilled");
  return ORDERS.filter((o) => o.fulfillment === ORDER_FILTER);
}

function addressLines(o) {
  const a = o.ship_address;
  if (!a) return null;
  return [o.ship_name, a.line1, a.line2, [a.postal_code, a.city].filter(Boolean).join(" "),
          a.state, a.country].filter(Boolean);
}

function paintOrders() {
  const rows = filterOrders();
  const paid = ORDERS.filter((o) => o.status === "paid");
  const gross = paid.reduce((s, o) => s + o.subtotal_cents, 0);
  const toPack = ORDERS.filter((o) => o.status === "paid" && o.fulfillment === "unfulfilled").length;

  $("tabOrders").innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <span class="tag tag-ink">Orders</span>
        <span class="tag">${paid.length} paid · ${money(gross)} gross · ${toPack} to pack</span>
      </div>
      <div class="row" style="margin-bottom:16px">
        ${FILTERS.map(([k, label]) =>
          `<button class="chip ${ORDER_FILTER === k ? "tag-chip on" : ""}" data-filter="${k}">${label}</button>`).join("")}
      </div>
      <div id="orderMsg"></div>
      ${rows.length ? rows.map(orderRow).join("") : `<p class="empty">Nothing here.</p>`}
    </div>`;

  document.querySelectorAll("[data-filter]").forEach((b) =>
    b.addEventListener("click", () => { ORDER_FILTER = b.dataset.filter; OPEN_ORDER = null; paintOrders(); }));
  document.querySelectorAll("[data-open]").forEach((b) =>
    b.addEventListener("click", () => {
      OPEN_ORDER = OPEN_ORDER === b.dataset.open ? null : b.dataset.open; paintOrders();
    }));
  document.querySelectorAll("[data-mark]").forEach((b) =>
    b.addEventListener("click", (e) => { e.stopPropagation(); markOrder(b.dataset.id, b.dataset.mark); }));
}

function orderRow(o) {
  const open = OPEN_ORDER === o.id;
  const badge = o.status !== "paid"
    ? `<span class="mini sold-out">${escapeHtml(o.status)}</span>`
    : `<span class="mini ship-${o.fulfillment}">${
        o.fulfillment === "unfulfilled" ? "to pack" : escapeHtml(o.fulfillment)}</span>`;
  const addr = addressLines(o);

  return `
    <div class="order-row ${open ? "open" : ""}">
      <button class="order-head" data-open="${o.id}">
        <span class="mini">${new Date(o.created_at).toLocaleDateString(cfg.LOCALE)}</span>
        <span class="mini" style="flex:1;text-align:left">${escapeHtml(o.email || "—")}</span>
        <span class="mini">${o.items.reduce((n, i) => n + i.quantity, 0)} pc</span>
        <span class="price">${money(o.total_cents)}</span>
        ${badge}
      </button>
      ${open ? `
      <div class="order-body">
        <div class="order-cols">
          <div>
            <span class="tag">Pack this</span>
            <ul class="pack-list">${o.items.map((i) => `
              <li><b>${i.quantity}&times;</b> ${escapeHtml(i.name)}${
                i.size ? ` <span class="tag">size ${escapeHtml(i.size)}</span>` : ""}</li>`).join("")}</ul>
          </div>
          <div>
            <span class="tag">Ship to</span>
            ${addr
              ? `<p class="mini" style="line-height:1.7;margin:6px 0 0">${addr.map(escapeHtml).join("<br>")}</p>`
              : `<p class="mini sold-out" style="margin:6px 0 0">No address recorded. Look this order up in Stripe.</p>`}
            ${o.shipping_cents ? `<p class="tag" style="margin-top:10px">Shipping ${money(o.shipping_cents)}</p>` : ""}
            ${o.discount_code ? `<p class="tag" style="margin-top:6px">Code ${escapeHtml(o.discount_code)} −${money(o.discount_cents)}</p>` : ""}
            ${o.referral_code ? `<p class="tag" style="margin-top:6px">Referred by ${escapeHtml(o.referral_code)}</p>` : ""}
            ${o.tracking ? `<p class="tag" style="margin-top:10px">Tracking ${escapeHtml(o.tracking)}</p>` : ""}
          </div>
        </div>
        ${o.status === "paid" ? `
        <div class="row" style="margin-top:16px">
          ${o.fulfillment === "unfulfilled"
            ? `<button class="btn btn-slim" data-mark="shipped" data-id="${o.id}">Mark shipped</button>` : ""}
          ${o.fulfillment === "shipped"
            ? `<button class="btn btn-slim" data-mark="received" data-id="${o.id}">Mark received</button>` : ""}
          ${o.fulfillment !== "unfulfilled"
            ? `<button class="btn btn-hollow btn-slim" data-mark="unfulfilled" data-id="${o.id}">Undo</button>` : ""}
        </div>` : `<p class="notice" style="margin-top:14px">Not paid, so nothing to send yet.</p>`}
      </div>` : ""}
    </div>`;
}

async function markOrder(id, state) {
  const patch = { fulfillment: state };
  if (state === "shipped") {
    patch.shipped_at = new Date().toISOString();
    const t = prompt("Tracking number, if you have one. Leave blank to skip.");
    if (t === null) return;
    if (t.trim()) patch.tracking = t.trim();
  }
  if (state === "received") patch.received_at = new Date().toISOString();
  if (state === "unfulfilled") { patch.shipped_at = null; patch.received_at = null; }

  const { error } = await sb.from("orders").update(patch).eq("id", id);
  if (error) { $("orderMsg").innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
  await loadOrders();
}

/* ================= discounts ================= */
let DISCOUNTS = [];

async function loadDiscounts() {
  const { data } = await sb.from("discount_codes").select("*").order("created_at", { ascending: false });
  DISCOUNTS = data || [];
  paintDiscounts();
}

function discountLabel(d) {
  return d.kind === "percent" ? `${d.value}% off` : `${money(d.value)} off`;
}

function discountState(d) {
  if (!d.active) return ["off", "switched off"];
  if (d.expires_at && new Date(d.expires_at) < new Date()) return ["off", "expired"];
  if (d.max_uses != null && d.uses >= d.max_uses) return ["off", "used up"];
  return ["on", "live"];
}

function paintDiscounts() {
  $("tabDiscounts").innerHTML = `
    <div class="admin-grid">
      <div class="panel">
        <div class="panel-head"><span class="tag tag-ink">New code</span></div>
        <label class="field"><span>Code</span><input class="input" id="dCode" placeholder="LAUNCH10" style="text-transform:uppercase"></label>
        <div class="row">
          <label class="field" style="flex:1"><span>Type</span>
            <select class="input" id="dKind">
              <option value="percent">Percent off</option>
              <option value="amount">Fixed amount off</option>
            </select></label>
          <label class="field" style="width:100px"><span>Value</span><input class="input" id="dValue" type="number" min="1" value="10"></label>
        </div>
        <div class="row">
          <label class="field" style="flex:1"><span>Min spend (${cfg.CURRENCY.toUpperCase()})</span><input class="input" id="dMin" type="number" step="0.01" min="0" value="0"></label>
          <label class="field" style="flex:1"><span>Max uses</span><input class="input" id="dMax" type="number" min="1" placeholder="unlimited"></label>
        </div>
        <label class="field"><span>Expires</span><input class="input" id="dExp" type="date"></label>
        <label class="field"><span>Note to self</span><input class="input" id="dNote" placeholder="Instagram launch"></label>
        <div id="dMsg"></div>
        <button class="btn" id="dGo">Create code</button>
      </div>

      <div class="panel">
        <div class="panel-head"><span class="tag tag-ink">Codes</span><span class="tag">${DISCOUNTS.length}</span></div>
        ${DISCOUNTS.length ? `
        <table class="grid-table">
          <thead><tr><th>Code</th><th>Discount</th><th>Used</th><th>Status</th><th></th></tr></thead>
          <tbody>${DISCOUNTS.map((d) => {
            const [cls, label] = discountState(d);
            return `<tr>
              <td><b class="mini">${escapeHtml(d.code)}</b>${d.note ? `<br><span class="mini" style="color:var(--ink-soft)">${escapeHtml(d.note)}</span>` : ""}</td>
              <td class="mini">${discountLabel(d)}${d.min_subtotal_cents ? `<br>over ${money(d.min_subtotal_cents)}` : ""}</td>
              <td class="mini">${d.uses}${d.max_uses != null ? ` / ${d.max_uses}` : ""}</td>
              <td class="mini ship-${cls === "on" ? "shipped" : "unfulfilled"}">${label}</td>
              <td class="row">
                <button class="tab" data-toggle-d="${escapeHtml(d.code)}" style="padding:2px 6px">${d.active ? "Switch off" : "Switch on"}</button>
                <button class="tab danger" data-del-d="${escapeHtml(d.code)}" style="padding:2px 6px">Delete</button>
              </td></tr>`;
          }).join("")}</tbody>
        </table>` : `<p class="empty">No codes yet.</p>`}
      </div>
    </div>`;

  $("dGo")?.addEventListener("click", createDiscount);
  document.querySelectorAll("[data-toggle-d]").forEach((b) =>
    b.addEventListener("click", async () => {
      const d = DISCOUNTS.find((x) => x.code === b.dataset.toggleD);
      await sb.from("discount_codes").update({ active: !d.active }).eq("code", d.code);
      loadDiscounts();
    }));
  document.querySelectorAll("[data-del-d]").forEach((b) =>
    b.addEventListener("click", async () => {
      if (!confirm(`Delete ${b.dataset.delD}? Orders that used it keep their record.`)) return;
      await sb.from("discount_codes").delete().eq("code", b.dataset.delD);
      loadDiscounts();
    }));
}

async function createDiscount() {
  const msg = $("dMsg");
  const code = $("dCode").value.trim().toUpperCase();
  const kind = $("dKind").value;
  const raw  = parseFloat($("dValue").value || "0");
  if (!code || !raw) { msg.innerHTML = `<p class="notice notice-bad">A code and a value are required.</p>`; return; }
  if (kind === "percent" && raw > 100) { msg.innerHTML = `<p class="notice notice-bad">A percentage cannot exceed 100.</p>`; return; }

  const row = {
    code, kind,
    value: kind === "percent" ? Math.round(raw) : Math.round(raw * 100),
    min_subtotal_cents: Math.round(parseFloat($("dMin").value || "0") * 100),
    max_uses: $("dMax").value ? parseInt($("dMax").value, 10) : null,
    expires_at: $("dExp").value ? new Date($("dExp").value + "T23:59:59").toISOString() : null,
    note: $("dNote").value.trim() || null,
  };
  const { error } = await sb.from("discount_codes").insert(row);
  if (error) { msg.innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
  $("dCode").value = ""; $("dNote").value = "";
  loadDiscounts();
}

/* ================= settings ================= */
let SETTINGS = {};

async function loadSettings() {
  const { data } = await sb.from("shop_settings").select("key,value");
  SETTINGS = Object.fromEntries((data || []).map((r) => [r.key, r.value]));
  paintSettings();
}

function paintSettings() {
  const eur = (c) => ((c || 0) / 100).toFixed(2);
  $("tabSettings").innerHTML = `
    <div class="admin-grid">
      <div class="panel">
        <div class="panel-head"><span class="tag tag-ink">Shipping &amp; fees</span></div>
        <p class="mini" style="color:var(--ink-soft);line-height:1.6;margin-top:0">
          Discount codes reduce the goods only. Shipping and handling stay on the bill,
          so a 100% code costs you the shirt but not the postage.</p>
        <label class="field"><span>Flat shipping (${cfg.CURRENCY.toUpperCase()})</span>
          <input class="input" id="sShip" type="number" step="0.01" min="0" value="${eur(SETTINGS.shipping_cents)}"></label>
        <label class="field"><span>Free shipping over (0 = never)</span>
          <input class="input" id="sFree" type="number" step="0.01" min="0" value="${eur(SETTINGS.free_shipping_over_cents)}"></label>
        <label class="field"><span>Handling fee (0 = none)</span>
          <input class="input" id="sHand" type="number" step="0.01" min="0" value="${eur(SETTINGS.handling_cents)}"></label>
        <div id="sMsg"></div>
        <button class="btn" id="sGo">Save</button>
      </div>

      <div class="panel">
        <div class="panel-head"><span class="tag tag-ink">How a bill adds up</span></div>
        <table class="grid-table">
          <tbody>
            <tr><td class="mini">Goods</td><td class="mini">from the item and its size</td></tr>
            <tr><td class="mini">− Discount</td><td class="mini">applies to goods only</td></tr>
            <tr><td class="mini">+ Shipping</td><td class="mini">${SETTINGS.free_shipping_over_cents
              ? `free over ${money(SETTINGS.free_shipping_over_cents)}` : "flat, always charged"}</td></tr>
            <tr><td class="mini">+ Handling</td><td class="mini">${SETTINGS.handling_cents
              ? "charged on every order" : "not charged"}</td></tr>
            <tr><td class="mini">− Store credit</td><td class="mini">may cover any part of the bill</td></tr>
          </tbody>
        </table>
        <p class="mini" style="color:var(--ink-soft);line-height:1.6;margin-top:14px">
          Handling is charged on every order regardless of payment method. A fee that
          varied by payment method would count as a card surcharge, which EU rules do
          not permit for consumer cards. Worth confirming with your accountant.</p>
      </div>
    </div>`;

  $("sGo")?.addEventListener("click", async () => {
    const msg = $("sMsg");
    const rows = [
      { key: "shipping_cents",           value: Math.round(parseFloat($("sShip").value || "0") * 100) },
      { key: "free_shipping_over_cents", value: Math.round(parseFloat($("sFree").value || "0") * 100) },
      { key: "handling_cents",           value: Math.round(parseFloat($("sHand").value || "0") * 100) },
    ];
    for (const r of rows) {
      const { error } = await sb.from("shop_settings")
        .upsert({ ...r, updated_at: new Date().toISOString() }, { onConflict: "key" });
      if (error) { msg.innerHTML = `<p class="notice notice-bad">${escapeHtml(error.message)}</p>`; return; }
    }
    await loadSettings();
    $("sMsg").innerHTML = `<p class="notice">Saved.</p>`;
  });
}

/* ================= subscribers ================= */
let SUBS = [];

async function loadSubs() {
  const { data } = await sb.from("subscribers")
    .select("email,lang,source,created_at,unsubscribed_at")
    .order("created_at", { ascending: false });
  SUBS = data || [];
  paintSubs();
}

function paintSubs() {
  const live = SUBS.filter((x) => !x.unsubscribed_at);
  const it = live.filter((x) => x.lang === "it").length;

  $("tabSubs").innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <span class="tag tag-ink">Subscribers</span>
        <span class="tag">${live.length} on the list · ${it} Italian · ${SUBS.length - live.length} left</span>
        <button class="tab" id="subCsv" style="margin-left:auto">Export CSV</button>
      </div>
      <p class="mini" style="color:var(--ink-soft);line-height:1.6">
        Addresses are collected here but sending happens elsewhere. Export the CSV
        and import it into whichever mailer you use, and put an unsubscribe link
        pointing at ${escapeHtml(cfg.SITE_URL)}/unsubscribe.html?t=TOKEN in every send.</p>
      ${live.length ? `
      <table class="grid-table">
        <thead><tr><th>Email</th><th>Language</th><th>From</th><th>Joined</th></tr></thead>
        <tbody>${SUBS.map((x) => `
          <tr>
            <td class="mini ${x.unsubscribed_at ? "sold-out" : ""}">${escapeHtml(x.email)}</td>
            <td class="mini">${escapeHtml(x.lang)}</td>
            <td class="mini">${escapeHtml(x.source || "—")}</td>
            <td class="mini">${new Date(x.created_at).toLocaleDateString(cfg.LOCALE)}</td>
          </tr>`).join("")}</tbody>
      </table>` : `<p class="empty">Nobody has signed up yet.</p>`}
    </div>`;

  $("subCsv")?.addEventListener("click", async () => {
    // the token is only fetched at export time, never rendered on screen
    const { data } = await sb.from("subscribers")
      .select("email,lang,token,created_at").is("unsubscribed_at", null);
    const rows = [["email", "lang", "unsubscribe_url", "joined"]].concat(
      (data || []).map((x) => [x.email, x.lang,
        `${cfg.SITE_URL}/unsubscribe.html?t=${x.token}`, x.created_at]));
    const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    const a = document.createElement("a");
    a.href = url; a.download = `subscribers-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click(); URL.revokeObjectURL(url);
  });
}

boot();
</script>
